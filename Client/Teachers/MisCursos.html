<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis Cursos - SMARTWEB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="MisCursos.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main class="container mt-4 mb-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary"><i class="fas fa-book me-2"></i> Mis Cursos</h1>
            <p class="text-muted">Administra y revisa todos los cursos que has creado.</p>
        </div>

        <div class="text-end mb-3">
            <a href="CrearCursos.html" class="btn btn-success">
                <i class="fas fa-plus-circle"></i> Crear Nuevo Curso
            </a>
        </div>

        <div class="table-responsive shadow-sm rounded bg-white p-3">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Título</th>
                        <th>Categoría</th>
                        <th>Fecha Creación</th>
                        <th>Estado</th>
                        <th>Sesiones</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCursos">
                    <tr>
                        <td colspan="6" class="text-center text-muted">Cargando cursos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <div class="modal fade" id="detalleCursoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-primary">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-info-circle me-2"></i> Detalles del Curso</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Título:</strong> <span id="detalleTitulo"></span></p>
                    <p><strong>Descripción:</strong> <span id="detalleDescripcion"></span></p>
                    <p><strong>Sesiones:</strong></p>
                    <ul id="detalleSesiones" class="list-group"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/html_includes.js"></script> 
    
    <script src="./MisCursos.js"></script> 
</body>
</html>
