<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | SmartWeb</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="login.css" />
</head>
<body>
    <div class="background-overlay"></div> 

    <div class="container">
        <div class="login-box">
            <div class="form-section">
                <div class="logo">
                    <h1>SmartWeb</h1>
                </div>

                <form id="loginForm">
                    <h2>Bienvenido de nuevo</h2>
                    <p class="subtitle">Ingresa a tu cuenta para seguir aprendiendo</p>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="hello@ejemplo.com" required />

                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required />

                    <button type="submit" id="loginButton">Entrar</button>

                    <div class="register-link">
                        <p>¿No tienes una cuenta?
                            <a href="../register/register.html">Crea una</a>
                        </p>
                    </div>
                </form>
            </div>

            <div class="image-section">
                <img src="../logo.png" alt="SmartWeb Logo" />
                <p>Aprende a través de videollamadas</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../VistasSecundarias/Politicas.html">Políticas de Privacidad</a>
                <a href="../VistasSecundarias/Terminos.html">Términos de Servicio</a>
                <a href="../AboutUs/AboutUs.html">Contacto</a>
            </div>
            <div class="copyright">
                © 2025 SMARTWEB — Plataforma Educativa Internacional. Todos los derechos reservados.
            </div>
        </div>
    </footer>

    <script src="login.js"></script>
</body>
</html>
