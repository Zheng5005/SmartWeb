<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear Llamada - SMARTWEB Docente</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary-dark: #0e2a47;
      --primary-medium: #265c8b;
      --primary-light: #3a7bb6;
      --accent-color: #ff7e5f;
      --accent-hover: #e86a4c;
      --light-bg: #f4f7fb;
      --card-bg: #ffffff;
      --text-dark: #2d3748;
      --text-light: #718096;
    }

    body {
      background: var(--light-bg);
      font-family: 'Poppins', sans-serif;
      color: var(--text-dark);
    }

    .navbar {
      background: var(--primary-dark);
      padding: 12px 0;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white !important;
    }

    .logo-img {
      height: 40px;
      width: auto;
    }

    .nav-link {
      color: #d8e6ff !important;
      font-weight: 500;
      transition: 0.3s;
      border-radius: 6px;
      padding: 8px 16px !important;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white !important;
    }

    /* Hero */
    .teacher-hero {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-medium) 100%);
      color: white;
      padding: 3rem 2rem;
      border-radius: 20px;
      margin: 2rem auto;
      box-shadow: 0 10px 30px rgba(14, 42, 71, 0.2);
      text-align: center;
    }

    .teacher-hero h1 {
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* Main card */
    .card-create-call {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      border-left: 5px solid var(--primary-medium);
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
    }

    .card-create-call h4 {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .btn-create {
      background: var(--primary-medium);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 25px;
      transition: all 0.3s;
    }

    .btn-create:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    .call-result {
      margin-top: 1.5rem;
      background: var(--light-bg);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.95rem;
      text-align: left;
      border: 1px solid rgba(0,0,0,0.05);
      display: none;
    }

    .copy-btn {
      margin-top: 10px;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 15px;
      border-radius: 6px;
      font-weight: 500;
      transition: 0.3s;
    }

    .copy-btn:hover {
      background: var(--accent-hover);
    }

    footer {
      background: var(--primary-dark);
      color: white;
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="logo.png" alt="SMARTWEB Logo" class="logo-img">
        SMARTWEB
      </a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-home me-1"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-book me-1"></i> Mis Cursos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" style="background-color:#3a7bb6;color:white !important;"><i class="fas fa-sign-out-alt me-1"></i> Cerrar sesión</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <div class="container">
    <div class="teacher-hero">
      <h1>Crear Nueva Llamada</h1>
      <p>Genera un enlace de videollamada para tus clases o reuniones</p>
    </div>
  </div>

  <!-- Formulario -->
  <main class="container">
    <div class="card-create-call">
      <h4><i class="fas fa-video me-2 text-primary"></i> Crear enlace de videollamada</h4>

      <button id="createCallBtn" class="btn-create">
        <i class="fas fa-link me-2"></i> Crear Enlace
      </button>

      <div class="call-result mt-4" id="callResult">
        <h6 class="fw-bold"><i class="fas fa-check-circle text-success me-1"></i> Llamada creada con éxito</h6>
        <p><strong>Call ID:</strong> <span id="callId"></span></p>
        <p><strong>Enlace para compartir:</strong></p>
        <input type="text" id="callLink" class="form-control" readonly />
        <button id="copyBtn" class="copy-btn"><i class="fas fa-copy me-1"></i> Copiar Enlace</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2025 SMARTWEB — Plataforma Educativa
  </footer>

  <script>
    document.getElementById('createCallBtn').addEventListener('click', async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Debes iniciar sesión");
        window.location.href = "../index.html";
        return false;
      }

      const user = decodeJWT(token);

      if (user.exp && Date.now() >= user.exp * 1000) {
        alert("Sesión expirada");
        localStorage.removeItem("token");
        window.location.href = "../login/login.html";
        return false;
      }
      console.log(user.sub)

      try {
        const response = await fetch('http://127.0.0.1:8000/getstream/create/call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: user.sub })
        });

        if (!response.ok) throw new Error('Error al crear la llamada');
        const data = await response.json();

        document.getElementById('callId').textContent = data.call_id;
        const link = `${window.location.origin}/videollamada.html?call_id=${data.call_id}&user_id=${data.user_id}`;
        document.getElementById('callLink').value = link;

        document.getElementById('callResult').style.display = 'block';
      } catch (err) {
        console.error(err);
        alert('❌ No se pudo crear la llamada. Verifica tu conexión o intenta nuevamente.');
      }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const linkInput = document.getElementById('callLink');
      linkInput.select();
      document.execCommand('copy');
      alert('📋 Enlace copiado al portapapeles.');
    });
    
    function decodeJWT(token) {
      try {
        const payload = token.split(".")[1];
        return JSON.parse(atob(payload));
      } catch (e) {
        console.error("Error decoding token:", e);
        return null;
      }
    }
  </script>
</body>
</html>
