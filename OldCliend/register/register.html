<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | SMARTWEB</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="register.css" /> 
</head>
<body>
    <div class="background-overlay"></div> 

    <div class="container">
        <div class="login-box">
            <div class="form-section">
                <div class="logo">
                    <h1>SmartWeb</h1>
                </div>

                <div class="form-content-wrapper">
                    <form id="registerForm">
                        <h2>Crea tu cuenta</h2>
                        <p class="subtitle">Selecciona tu tipo de usuario y regístrate</p>
                        
                        <div class="user-type-selection">
                            <label class="fw-bold">¿Cómo deseas registrarte?</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="userType" id="typeStudent" value="student" checked>
                                    <label class="form-check-label" for="typeStudent">Estudiante</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="userType" id="typeTeacher" value="teacher">
                                    <label class="form-check-label" for="typeTeacher">Profesor</label>
                                </div>
                            </div>
                        </div>

                        <div class="name-fields">
                            <div class="field-group">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" placeholder="Juan" required>
                            </div>
                            <div class="field-group">
                                <label for="apellido">Apellido</label>
                                <input type="text" id="apellido" placeholder="Pérez" required>
                            </div>
                        </div>

                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="hello@ejemplo.com" required>

                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>

                        <div class="motivation-field" id="motivationField">
                            <label for="motivation">Motivación para ser profesor</label>
                            <textarea id="motivation" rows="3" placeholder="Cuéntanos por qué quieres ser profesor..."></textarea>
                        </div>

                        <div class="motivation-field" id="collegeField">
                            <label for="college">Instituto</label>
                            <input type="text" id="college" placeholder="UNICAES" required>
                        </div>

                        <div class="motivation-field" id="cedulaField">
                            <label for="cedula">Cedula Profesional</label>
                            <input type="text" id="cedula" placeholder="1234" required>
                        </div>

                        <button type="submit" id="registerButton">Registrarse</button>

                        <div class="register-link">
                            <p>
                                ¿Ya tienes una cuenta?
                                <a href="../login/login.html">Ingresa</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>

            <div class="image-section">
                <img src="../logo.png" alt="SmartWeb Logo" />
                <p>Aprende a través de videollamadas</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../VistasSecundarias/Politicas.html">Políticas de Privacidad</a>
                <a href="../VistasSecundarias/Terminos.html">Términos de Servicio</a>
                <a href="../AboutUs/AboutUs.html">Contacto</a>
            </div>
            <div class="copyright">
                © 2025 SMARTWEB — Plataforma Educativa Internacional. Todos los derechos reservados.
            </div>
        </div>
    </footer>

    <script src="register.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const studentRadio = document.getElementById('typeStudent');
            const teacherRadio = document.getElementById('typeTeacher');
            const motivationField = document.getElementById('motivationField');
            const motivationInput = document.getElementById('motivation');

            const collegeField = document.getElementById('collegeField');
            const collegeInput = document.getElementById('college');
            const cedulaField = document.getElementById('cedulaField');
            const cedulaInput = document.getElementById('cedula');

            function toggleMotivationField() {
                if (teacherRadio.checked) {
                    motivationField.classList.add('active');
                    motivationInput.required = true;

                    collegeField.classList.add('active');
                    collegeInput.required = true;
                    cedulaField.classList.add('active');
                    cedulaInput.required = true;
                } else {
                    motivationField.classList.remove('active');
                    motivationInput.required = false;
                }
            }

            studentRadio.addEventListener('change', toggleMotivationField);
            teacherRadio.addEventListener('change', toggleMotivationField);
            toggleMotivationField();
        });
    </script>
</body>
</html>
